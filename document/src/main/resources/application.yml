server:
  port: 8082

spring:
  application:
    name: intelligent-trial-document
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/intelligent_trial?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.intelligent.trial.document.entity
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ==================== MinIO 对象存储配置 ====================
minio:
  endpoint: http://localhost:9000
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: intelligent-trial
  # 文件上传路径前缀
  path-prefix: documents

# ==================== DashScope（通义千问）API 配置 ====================
dashscope:
  api-key: ${DASHSCOPE_API_KEY:sk-xxxxxx}
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  # 段落分类模型
  classify-model: qwen-plus
  # OCR模型（用于PDF/图片识别）
  ocr-model: qwen-vl-max
  # 向量嵌入模型
  embedding-model: text-embedding-v3
  # DeepSeek API Key
  deepseek-api-key: ${DEEPSEEK_API_KEY:sk-xxxxxx}
  # DeepSeek API Base URL（OpenAI兼容端点）
  deepseek-base-url: https://api.deepseek.com/v1
  # DeepSeek 模型名称
  deepseek-model: deepseek-chat

# ==================== 异步线程池配置 ====================
async:
  executor:
    core-pool-size: 4
    max-pool-size: 8
    queue-capacity: 100
    thread-name-prefix: doc-parse-

# ==================== Milvus 向量数据库配置（预留） ====================
milvus:
  host: localhost
  port: 19530
  collection-name: document_vectors

logging:
  level:
    com.intelligent.trial: debug

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
