server:
  port: 8080

spring:
  application:
    name: intelligent-trial-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        # 认证服务
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**,/api/system/**
        # 文档解析服务
        - id: document-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/document/**
        # 多库管理服务
        - id: repository-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/repository/**
        # 案件管理服务
        - id: case-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/case/**
        # 流程引擎服务
        - id: workflow-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/workflow/**
        # 文书生成服务
        - id: report-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/report/**
        # 以案促改服务
        - id: promotion-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/promotion/**

      # 全局 CORS 配置
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

# JWT 网关配置
gateway:
  jwt:
    # 白名单：不需要 Token 验证的路径
    whitelist:
      - /api/auth/login
      - /api/auth/captcha
      - /api/auth/refresh
      - /actuator/health
      - /actuator/info

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.intelligent.trial.gateway: debug
    org.springframework.cloud.gateway: info
