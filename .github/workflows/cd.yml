# ============================================
# AI 纪检监察智能审理一体化平台
# CD Pipeline — Docker Build & Publish
# ============================================
# 触发: 创建 Release tag (v*) 或手动触发
# 产物: Docker 镜像推送到 GitHub Container Registry (ghcr.io)
# ============================================

name: CD — Docker Build & Publish

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (default: latest)'
        required: false
        default: 'latest'

env:
  JAVA_VERSION: '8'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ── Build & Push Docker Images ──
  build-and-push:
    name: Build & Push — ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - auth
          - casemanage
          - document
          - repository
          - report
          - workflow
          - promotion
          - punishment
          - readingnote
          - api-gateway
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ] || [ "${{ github.event_name }}" = "push" ]; then
            # Use the release tag (v1.0.0 → 1.0.0)
            TAG="${GITHUB_REF#refs/tags/v}"
            echo "tag=${TAG}" >> $GITHUB_OUTPUT
            echo "latest=true" >> $GITHUB_OUTPUT
          else
            TAG="${{ github.event.inputs.tag || 'latest' }}"
            echo "tag=${TAG}" >> $GITHUB_OUTPUT
            echo "latest=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract module metadata
        id: meta
        run: |
          MODULE="${{ matrix.module }}"
          # Map module name to artifact name
          case $MODULE in
            casemanage) ARTIFACT="intelligent-trial-case" ;;
            *) ARTIFACT="intelligent-trial-${MODULE}" ;;
          esac
          echo "module=${MODULE}" >> $GITHUB_OUTPUT
          echo "artifact=${ARTIFACT}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/${{ steps.meta.outputs.module }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ steps.meta.outputs.module }}:${{ steps.tag.outputs.tag }}
            ${{ steps.tag.outputs.latest == 'true' && format('{0}/{1}/{2}:latest', env.REGISTRY, env.IMAGE_PREFIX, steps.meta.outputs.module) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # ── Full Integration Test ──
  integration-test:
    name: Integration — Docker Compose
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: |
          docker compose version

      - name: Start infrastructure (MySQL + Redis + MinIO)
        run: |
          # Only start infra for integration testing
          docker compose up -d mysql redis minio minio-init
          
          # Wait for services to be healthy
          echo "Waiting for MySQL..."
          timeout 60 bash -c 'while ! docker compose exec mysql mysqladmin ping -h localhost -u root -pRoot@Trial2026! 2>/dev/null; do sleep 2; done'
          echo "MySQL is ready!"

      - name: Run database initialization
        run: |
          if [ -f "sql/init.sql" ]; then
            docker compose exec -T mysql mysql -u root -pRoot@Trial2026! intelligent_trial < sql/init.sql
            echo "✅ Database initialized"
          fi

      - name: Health check summary
        run: |
          echo "Infrastructure services status:"
          docker compose ps

  # ── Deploy Notification ──
  notify:
    name: Notify — Deployment Complete
    runs-on: ubuntu-latest
    needs: [build-and-push, integration-test]
    if: always()

    steps:
      - name: Deployment status
        run: |
          if [ "${{ needs.build-and-push.result }}" = "success" ] && [ "${{ needs.integration-test.result }}" = "success" ]; then
            echo "✅ Docker images published successfully!"
            echo "📦 Available at: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/"
            echo "🏷️  Tag: ${{ github.ref_name || 'latest' }}"
          else
            echo "❌ Deployment failed"
            echo "Build status: ${{ needs.build-and-push.result }}"
            echo "Integration status: ${{ needs.integration-test.result }}"
            exit 1
          fi
