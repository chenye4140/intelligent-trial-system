server:
  port: 8088

spring:
  application:
    name: intelligent-trial-promotion
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/intelligent_trial?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  redis:
    host: localhost
    port: 6379
    password:
    database: 0

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.intelligent.trial.promotion.entity
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ==================== AI 配置 ====================
ai:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:sk-xxxxxx}
    base-url: https://api.deepseek.com
    model: deepseek-v4-pro

# ==================== 异步线程池配置 ====================
async:
  executor:
    core-pool-size: 4
    max-pool-size: 8
    queue-capacity: 100
    thread-name-prefix: promotion-

logging:
  level:
    com.intelligent.trial: debug
