server:
  port: 8084

spring:
  application:
    name: intelligent-trial-workflow
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/trial_workflow?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root

# Flowable configuration
flowable:
  # Auto-deploy BPMN files from classpath
  check-process-definitions: true
  # Database schema update strategy: true - create if not exists, update if exists
  database-schema-update: true
  # History level: none / activity / audit / full
  history-level: full
  # Disable async executor to avoid unnecessary thread pool overhead
  async-executor-activate: false
  # Disable REST API (we provide our own REST controllers)
  rest-api-enabled: false
  # Disable app engine
  app:
    enabled: false
  # Disable IDM engine
  idm:
    enabled: false
  # Disable form engine
  form:
    enabled: false
  # Disable content engine
  content:
    enabled: false
  # Disable CMMN
  cmmn:
    enabled: false
  # Disable DMN
  dmn:
    enabled: false

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.intelligent.trial.workflow.entity
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.intelligent.trial: debug
    org.flowable: info
